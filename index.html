<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f2" />
    <title>Amritapuri Campus Map</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <div id="map" aria-label="Interactive map of the Amritapuri campus area"></div>
      <button class="range-warning" id="range-warning" type="button" role="alert" aria-label="Campus range warning" aria-expanded="false" hidden>
        <i class="fi fi-rr-triangle-warning" aria-hidden="true"></i>
        <span class="range-warning-message"><strong>Outside campus range</strong>Browse freely; routing is available within 17 km of campus.</span>
      </button>

      <header class="topbar">
        <a class="brand" href="#" aria-label="Amritapuri Campus Map home">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span class="brand-text">Amritapuri <strong>Campus Map</strong></span>
        </a>
        <button class="icon-button theme-toggle" type="button" aria-label="Switch to dark mode" title="Switch theme">
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.8A8.5 8.5 0 0 1 9.2 4a8.5 8.5 0 1 0 10.8 10.8Z"/></svg>
        </button>
      </header>

      <section class="search-card">
        <p class="eyebrow">Amrita Vishwa Vidyapeetham</p>
        <div class="search-row">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-3.6-3.6"/></svg>
          <input id="search-input" type="search" placeholder="Search hostels, medical shops, gyms…" aria-label="Search places" />
        </div>
        
        <div class="chips" id="chips" role="tablist" aria-label="Filter by category"></div>
        <p class="location-status"><span class="status-dot"></span><span id="status-text">Finding your location\u2026</span></p>
      </section>

      <div class="map-controls">
        <button class="control-button" id="location-button" type="button" aria-label="Show my current location" title="My location">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20.5 3.5-6.9 16.9-3.2-7.2-7.2-3.2 16.9-6.9Z"/><path d="m10.4 13.2 3.2-3.2"/></svg>
        </button>
        <button class="control-button" id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button class="control-button" id="zoom-out" type="button" aria-label="Zoom out">−</button>
      </div>

      <section class="place-sheet" id="sheet" aria-label="Places around campus">
        <button class="sheet-grabber" id="sheet-handle" type="button" aria-label="Expand or collapse locations"><span class="sheet-handle"></span></button>
        <div class="sheet-list-view">
          <div class="sheet-title-row"><h2>Around the campus</h2><span id="result-count"></span></div>
          <div class="places" id="places"></div>
          <p class="empty-state" id="empty-state" hidden>No places match that search.</p>
        </div>
        <div class="sheet-detail-view" id="detail"></div>
      </section>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    <script src="app.js"></script>
  </body>
</html>
